<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>{{ cfg.nombre_sistema }}</title>
<link rel="icon" href="{{ url_for('static', filename=cfg.logo) }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/gso.css') }}"></head>
<body class="tema-{{ cfg.tema }}">
<div class="login">
  <form class="login-box" method="post" autocomplete="off">{{ csrf_campo() }}
    <img src="{{ url_for('static', filename=cfg.logo) }}" alt="Logo">
    {% if cfg.logo != 'img/logo.png' %}<h2 style="margin-top:-10px">{{ cfg.nombre_sistema }}</h2>{% endif %}
    {% with msgs = get_flashed_messages(with_categories=true) %}{% for c, m in msgs %}<div class="flash {{ c }}">{{ m }}</div>{% endfor %}{% endwith %}
    <div class="fila"><label for="u">Usuario:</label><input id="u" type="text" name="usuario" autofocus required></div>
    <div class="fila"><label for="p">Contraseña:</label><input id="p" type="password" name="contrasena" required></div>
    <button class="btn">Ingresar</button>
    <div><a href="{{ url_for('recuperar') }}" style="color:var(--texto)">Recuperar contraseña.</a></div>
  </form>
</div>
</body></html>
